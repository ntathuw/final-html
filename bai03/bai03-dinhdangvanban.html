<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Định dạng văn bản</title>
  <link rel="stylesheet" href="bai03-dinhdangvanban.css">
</head>
<body>
  <div class="demo">
    <h1 class="demo__title">Định dạng văn bản</h1>

    <p class="demo__item">
      <span class="demo__label">Hóa học:</span>
      <em class="demo__term">Nước:</em>
      <span class="demo__formula">H<sub>2</sub>O</span> ;
      <em class="demo__term">Axit Sunfuric:</em>
      <span class="demo__formula">H<sub>2</sub>SO<sub>4</sub></span>
    </p>

    <p class="demo__item">
      <span class="demo__label">Toán học:</span>
      <em class="demo__term">Phương trình bậc 2:</em>
      <span class="demo__formula">ax<sup>2</sup> + bx + c = 0</span>
    </p>

    <p class="demo__item">
      <span class="demo__label">Tin học:</span>
      <em class="demo__term">Vòng lặp for:</em>
    </p>

<pre class="demo__code">int tong = 0;
for(int i = 1; i &lt;= 10; i++)
	tong += i;
printf("Tong cac so tu 1 =&gt; 10 la: %d\n",tong);</pre>
  </div>
</body>
</html>
